<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logos/stageverify-app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>stageverify</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("stageverify-theme");
          document.documentElement.setAttribute(
            "data-sv-admin-theme",
            t === "dark" || t === "light" ? t : "light",
          );
        } catch (e) {
          document.documentElement.setAttribute("data-sv-admin-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
